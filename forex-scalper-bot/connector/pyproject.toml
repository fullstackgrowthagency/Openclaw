[project]
name = "fx-connector"
version = "0.1.0"
description = "Windows-only local MT4/5 connector for forex-scalper-bot -- relays account/quote/order data to the cloud backend over relay_protocol."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0,<15.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
