[project]
name = "relay-protocol"
version = "0.1.0"
description = "Wire protocol shared between the cloud-hosted forex-scalper-bot and the local MT4/5 connector -- Pydantic + stdlib only, no MT5 or fx_bot dependency, importable from either side of the relay."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
