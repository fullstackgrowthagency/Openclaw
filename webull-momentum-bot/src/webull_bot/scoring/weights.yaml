# Momentum Ignition Score (MIS) default weights.
#
# These are starting guesses, NOT tuned values -- the whole point of keeping
# them in a versioned config file is so backtesting/paper-trading results can
# drive changes here without touching code.
#
# Weights are written directly as percentages of the total (i.e. they
# already sum to 1.0) rather than arbitrary relative units -- MISConfig.load()
# still normalizes by dividing by the sum, so this is a no-op given these
# values, but it means the number next to each component here IS its actual
# share of the score, with no mental math required to read or edit it. Keep
# them summing to 1.0 when editing so that stays true (nothing enforces
# this at load time -- get_momentum_score_component_summary/the dashboard's
# score-breakdown panel will silently reflect whatever you put here).
#
# Bump `version` any time you change a weight or threshold so MomentumScore
# records stay traceable to the formula that produced them.
version: "v2.1-popularity-weighted"

# v2 (2026-08-09): added float_turnover_score/short_term_relative_volume_score/
# dollar_volume_acceleration_score -- metrics/rolling.py already computed
# these (float_turnover, relative_volume_5m, dollar_volume_accel_1m_3m) but
# the v1 score never consumed them (see ARCHITECTURE.md's "Momentum
# Ignition Score" section, which flagged this gap explicitly). Also
# reweighted so current real-time activity -- how much volume/turnover/
# dollar flow a name is seeing RIGHT NOW, i.e. how "popular" it already is
# -- dominates the ranking over structural/static factors (float size,
# distance to a breakout level, VWAP trend). The dashboard's candidate list
# is sorted by score descending, so this directly determines what surfaces
# at the top: a name everyone's already piling into should outrank one that
# merely looks structurally attractive but isn't seeing real volume yet.
#
# v2.1 (2026-08-09): rewritten as literal percentages (see comment above),
# and re-tuned per a second pass through the dashboard's Score Weighting
# Breakdown panel -- short_term_relative_volume_score raised further (the
# freshest "hot right now" signal), float_turnover_score/float_velocity_score/
# relative_volume_score trimmed slightly to make room, price_acceleration_score
# raised (price itself moving fast is a real popularity tell, not just
# volume), and breakout_proximity_score trimmed further (least
# popularity-relevant of the structural factors).
weights:
  float_score: 0.06                         # structural (float size)
  float_velocity_score: 0.12                # popularity: 5m float turnover rate -- trimmed from 0.13
  float_turnover_score: 0.10                # today's cumulative float turnover -- trimmed from 0.13
  relative_volume_score: 0.12               # popularity: whole-session RVOL -- trimmed from 0.13
  short_term_relative_volume_score: 0.15    # windowed (5m) RVOL, the freshest "hot right now" signal -- raised from 0.13
  volume_acceleration_score: 0.09
  dollar_volume_acceleration_score: 0.09
  price_acceleration_score: 0.10            # raised from 0.06 -- fast price movement is itself a popularity signal
  breakout_proximity_score: 0.05            # trimmed from 0.06 -- least popularity-relevant structural factor
  trend_quality_score: 0.05
  liquidity_score: 0.07

# Thresholds used to normalize raw metrics into 0-100 sub-scores, and to
# drive DISCOVERED -> WATCHING -> HEATING_UP -> ARMED transitions. All
# tunable; see scoring/momentum_ignition_score.py for how they're applied.
thresholds:
  max_free_float_shares: 20_000_000
  preferred_free_float_shares: 10_000_000
  # min_price/max_price here are NOT read by momentum_ignition_score.py --
  # kept only so this file doesn't carry a stale price range next to the
  # real ones (scanner/broad_scanner.py, data/universe.py). Update all
  # three together if this range changes again.
  min_price: 0.40
  max_price: 25.00
  min_relative_volume_for_watch: 2.0
  min_relative_volume_for_armed: 5.0
  min_float_velocity_5m_for_armed: 0.03   # 3% of float traded in 5 minutes
  min_float_turnover_for_notable: 0.5     # 50% of the float already traded today -- a large, deliberately high bar since this is cumulative, not a short window
  max_spread_pct: 2.0
  min_dollar_volume: 500_000
  armed_score_threshold: 70.0
  heating_up_score_threshold: 40.0
