# Momentum Ignition Score (MIS) default weights.
#
# These are starting guesses, NOT tuned values -- the whole point of keeping
# them in a versioned config file is so backtesting/paper-trading results can
# drive changes here without touching code.
#
# Weights are written directly as percentages of the total (i.e. they
# already sum to 1.0) rather than arbitrary relative units -- MISConfig.load()
# still normalizes by dividing by the sum, so this is a no-op given these
# values, but it means the number next to each component here IS its actual
# share of the score, with no mental math required to read or edit it. Keep
# them summing to 1.0 when editing so that stays true (nothing enforces
# this at load time -- get_momentum_score_component_summary/the dashboard's
# score-breakdown panel will silently reflect whatever you put here).
#
# Bump `version` any time you change a weight or threshold so MomentumScore
# records stay traceable to the formula that produced them.
version: "v2.3-tick-order-flow"

# v2 (2026-08-09): added float_turnover_score/short_term_relative_volume_score/
# dollar_volume_acceleration_score -- metrics/rolling.py already computed
# these (float_turnover, relative_volume_5m, dollar_volume_accel_1m_3m) but
# the v1 score never consumed them (see ARCHITECTURE.md's "Momentum
# Ignition Score" section, which flagged this gap explicitly). Also
# reweighted so current real-time activity -- how much volume/turnover/
# dollar flow a name is seeing RIGHT NOW, i.e. how "popular" it already is
# -- dominates the ranking over structural/static factors (float size,
# distance to a breakout level, VWAP trend). The dashboard's candidate list
# is sorted by score descending, so this directly determines what surfaces
# at the top: a name everyone's already piling into should outrank one that
# merely looks structurally attractive but isn't seeing real volume yet.
#
# v2.1 (2026-08-09): rewritten as literal percentages (see comment above),
# and re-tuned per a second pass through the dashboard's Score Weighting
# Breakdown panel -- short_term_relative_volume_score raised further (the
# freshest "hot right now" signal), float_turnover_score/float_velocity_score/
# relative_volume_score trimmed slightly to make room, price_acceleration_score
# raised (price itself moving fast is a real popularity tell, not just
# volume), and breakout_proximity_score trimmed further (least
# popularity-relevant of the structural factors).
#
# v2.2 (2026-08-13, entry-selectivity rework -- see docs/ARCHITECTURE.md):
# added room_to_target_score (how much room exists between the fixed
# +stop*R target and the next known static resistance level -- see
# metrics/volume_profile.py's evaluate_target_clearance and
# scoring/momentum_ignition_score.py's compute_components). Real motivation:
# the bot was losing more trades than it won, and a good chunk of losers
# were setups where the target itself sat behind a known resistance level
# -- MIS alone has no way to see that, since it only measures how much a
# name is currently moving, not whether there's actual room left to move
# INTO. Every existing weight below is simply the old v2.1 value scaled by
# 0.93 (preserves every component's *relative* weighting exactly -- nothing
# below was judged less important than anything else, this just makes room
# for the new one), with the freed 7% going to room_to_target_score.
#
# v2.3 (2026-08-14, TICK-derived order flow -- see docs/ARCHITECTURE.md):
# added order_flow_score (buy-vs-sell aggressor volume from the TICK
# streaming sub-type -- see metrics/rolling.py's compute_metrics `ticks`
# parameter and scoring/momentum_ignition_score.py's compute_components).
# Real motivation: every existing component measures THAT volume/price is
# moving, never WHICH SIDE is driving it -- a volume spike from aggressive
# buying and one from aggressive selling into a thin book look identical
# to every component above. Every existing weight (all 12, including
# room_to_target_score) is the v2.2 value scaled by 0.92 (preserves each
# component's *relative* weighting exactly), with the freed 8% going to
# order_flow_score. NOTE: this component is currently effectively inert
# in production -- Webull's real TICK `side` wire encoding hasn't been
# confirmed live yet (see brokers/webull/client.py's _TICK_SIDE_MAP), so
# order_flow_imbalance_1m reads None (excluded from the weighted average,
# not scored as 0) for every candidate until that's verified and the map
# is corrected if needed. Safe to ship weighted-in ahead of that
# verification specifically because of this None-until-confirmed fallback.
weights:
  float_score: 0.0513                          # structural (float size) -- 0.0558 * 0.92
  float_velocity_score: 0.1027                 # popularity: 5m float turnover rate -- 0.1116 * 0.92
  float_turnover_score: 0.0856                 # today's cumulative float turnover -- 0.0930 * 0.92
  relative_volume_score: 0.1027                # popularity: whole-session RVOL -- 0.1116 * 0.92
  short_term_relative_volume_score: 0.1283      # windowed (5m) RVOL, the freshest "hot right now" signal -- 0.1395 * 0.92
  volume_acceleration_score: 0.0770             # 0.0837 * 0.92
  dollar_volume_acceleration_score: 0.0770      # 0.0837 * 0.92
  price_acceleration_score: 0.0856              # fast price movement is itself a popularity signal -- 0.0930 * 0.92
  breakout_proximity_score: 0.0428              # least popularity-relevant structural factor -- 0.0465 * 0.92
  trend_quality_score: 0.0428                   # 0.0465 * 0.92
  liquidity_score: 0.0599                       # 0.0651 * 0.92
  room_to_target_score: 0.0644                  # v2.2 -- 0.07 * 0.92
  order_flow_score: 0.08                        # v2.3: new -- see comment above

# Thresholds used to normalize raw metrics into 0-100 sub-scores, and to
# drive DISCOVERED -> WATCHING -> HEATING_UP -> ARMED transitions. All
# tunable; see scoring/momentum_ignition_score.py for how they're applied.
thresholds:
  max_free_float_shares: 20_000_000
  preferred_free_float_shares: 10_000_000
  # min_price/max_price here are NOT read by momentum_ignition_score.py --
  # kept only so this file doesn't carry a stale price range next to the
  # real ones (scanner/broad_scanner.py, data/universe.py). Update all
  # three together if this range changes again.
  min_price: 0.40
  max_price: 25.00
  min_relative_volume_for_watch: 2.0
  min_relative_volume_for_armed: 5.0
  min_float_velocity_5m_for_armed: 0.03   # 3% of float traded in 5 minutes
  min_float_turnover_for_notable: 0.5     # 50% of the float already traded today -- a large, deliberately high bar since this is cumulative, not a short window
  max_spread_pct: 2.0
  min_dollar_volume: 500_000
  armed_score_threshold: 70.0
  heating_up_score_threshold: 40.0
  # Minimum classified (BUY or SELL, never UNKNOWN) TICK prints required
  # in the trailing 1-minute window before order_flow_score trusts the
  # ratio enough to score it at all -- see MomentumScoreComponents
  # .order_flow_score's docstring. Below this, order_flow_imbalance_1m is
  # still computed (see MomentumMetrics) but the MIS component itself
  # stays None/excluded, same reasoning as every other "not enough data
  # yet" gate in this file. 8 is a starting value, not backtested -- small
  # enough that a real move gets scored within seconds of ticks starting
  # to arrive, large enough that 1-2 stray prints can't swing the ratio
  # to +/-1.0 on pure noise.
  min_order_flow_sample_count: 8
