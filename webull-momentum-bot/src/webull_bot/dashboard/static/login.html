<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Day Trading Quant</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <div class="header-top">
    <a href="/"><img src="/logo.png" alt="FS Trading" class="header-logo"></a>
  </div>
</header>

<main class="auth-main">
  <section class="panel auth-card">
    <h2>Log in</h2>
    <form id="login-form">
      <label class="settings-field">
        <span>Email</span>
        <input type="email" id="login-email" autocomplete="email" required>
      </label>
      <label class="settings-field">
        <span>Password</span>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <div class="status-bar" id="login-result"></div>
      <div class="settings-actions">
        <button type="submit">Log in</button>
      </div>
    </form>
    <p class="hint auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
  </section>
</main>

<footer>Trading involves risk. Past performance of any strategy is not a guarantee of future results.</footer>

<script src="/auth.js"></script>
</body>
</html>
