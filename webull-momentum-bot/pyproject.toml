[project]
name = "webull-momentum-bot"
version = "0.1.0"
description = "Low-float momentum scanning and trading system built on the Webull OpenAPI"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
